name: Build PDF to EPUB V0.1.1

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract project
        run: |
          rm -rf project
          mkdir project
          unzip -q PdfToEpub_V0.1.1.zip -d project

      - name: Show project structure
        run: |
          find project -maxdepth 4 -type f | sort

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        working-directory: project
        run: gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PDF-to-EPUB-V0.1.1
          path: project/app/build/outputs/apk/debug/app-debug.apk
